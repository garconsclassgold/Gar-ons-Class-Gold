
<!DOCTYPE html>
<html lang="pt-BR" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Garçons Class Gold - Excelência em Eventos</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
      body {
        font-family: 'Inter', sans-serif;
        background-color: #000000;
        color: #ffffff;
        overflow-x: hidden;
      }
      .font-serif {
        font-family: 'Playfair Display', serif;
      }
      .text-gold {
        color: #D4AF37;
      }
      .bg-gold {
        background-color: #D4AF37;
      }
      .border-gold {
        border-color: #D4AF37;
      }
      .glass-card {
        background: rgba(255, 255, 255, 0.03);
        backdrop-filter: blur(10px);
        border: 1px solid rgba(212, 175, 55, 0.2);
      }
      .gold-gradient {
        background: linear-gradient(135deg, #D4AF37 0%, #F5E0A3 50%, #D4AF37 100%);
      }
      .gold-text-gradient {
        background: linear-gradient(135deg, #D4AF37 0%, #F5E0A3 50%, #D4AF37 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
      }
      
      @keyframes gold-glow {
        0% { box-shadow: 0 0 5px rgba(212, 175, 55, 0.2); }
        50% { box-shadow: 0 0 20px rgba(212, 175, 55, 0.5); }
        100% { box-shadow: 0 0 5px rgba(212, 175, 55, 0.2); }
      }
      .glow-gold {
        animation: gold-glow 4s infinite ease-in-out;
      }

      section:target h2 {
        animation: section-title-glow 2.5s ease-out;
      }

      @keyframes section-title-glow {
        0% { text-shadow: 0 0 0px transparent; }
        30% { text-shadow: 0 0 15px #D4AF37, 0 0 30px #F5E0A3; }
        100% { text-shadow: 0 0 0px transparent; }
      }

      @keyframes spotlight-pulse {
        0%, 100% { opacity: 0; transform: scale(0.8) translate(0, 0); }
        50% { opacity: 0.3; transform: scale(1.2) translate(10px, -10px); }
      }

      .spotlight {
        position: fixed;
        width: 60vw;
        height: 60vw;
        background: radial-gradient(circle, rgba(212, 175, 55, 0.15) 0%, rgba(212, 175, 55, 0) 70%);
        border-radius: 50%;
        pointer-events: none;
        z-index: 1;
        filter: blur(50px);
      }

      .spotlight-1 { top: -10%; left: -10%; animation: spotlight-pulse 8s infinite ease-in-out; }
      .spotlight-2 { bottom: -10%; right: -10%; animation: spotlight-pulse 10s infinite ease-in-out 2s; }
      .spotlight-3 { top: 20%; right: 10%; animation: spotlight-pulse 12s infinite ease-in-out 4s; width: 40vw; height: 40vw; }

      @keyframes float {
        0% { transform: translateY(0px); }
        50% { transform: translateY(-10px); }
        100% { transform: translateY(0px); }
      }
      .animate-float {
        animation: float 3s ease-in-out infinite;
      }

      @keyframes move-forever {
        0% { transform: translate3d(-90px, 0, 0); }
        100% { transform: translate3d(85px, 0, 0); }
      }

      .waves {
        position: relative;
        width: 100%;
        height: 15vh;
        margin-bottom: -7px;
        min-height: 100px;
        max-height: 150px;
      }

      .parallax > use {
        animation: move-forever 25s cubic-bezier(.55,.5,.45,.5) infinite;
      }
      .parallax > use:nth-child(1) { animation-delay: -2s; animation-duration: 7s; }
      .parallax > use:nth-child(2) { animation-delay: -3s; animation-duration: 10s; }
      .parallax > use:nth-child(3) { animation-delay: -4s; animation-duration: 13s; }
      .parallax > use:nth-child(4) { animation-delay: -5s; animation-duration: 20s; }

      @keyframes side-sway {
        0%, 100% { transform: skewX(-2deg) scaleX(1); }
        50% { transform: skewX(2deg) scaleX(1.1); }
      }
      
      @keyframes shimmer-vertical {
        0% { stop-offset: -100%; }
        100% { stop-offset: 200%; }
      }

      .side-wave-left {
        animation: side-sway 10s infinite ease-in-out;
        opacity: 0.25;
        pointer-events: none;
        filter: drop-shadow(0 0 10px rgba(212, 175, 55, 0.3));
      }
      
      .side-wave-right {
        animation: side-sway 12s infinite ease-in-out reverse;
        opacity: 0.25;
        pointer-events: none;
        filter: drop-shadow(0 0 10px rgba(212, 175, 55, 0.3));
      }

      .shimmer-effect {
        animation: shimmer-vertical 5s infinite linear;
      }

      @keyframes pulse-gold {
        0% { transform: scale(1); box-shadow: 0 10px 30px rgba(212, 175, 55, 0.3); }
        50% { transform: scale(1.05); box-shadow: 0 15px 45px rgba(212, 175, 55, 0.6); }
        100% { transform: scale(1); box-shadow: 0 10px 30px rgba(212, 175, 55, 0.3); }
      }
      .ad-pulse {
        animation: pulse-gold 3s infinite ease-in-out;
      }

      @keyframes slide-up {
        from { transform: translateY(100%) scale(0.9); opacity: 0; }
        to { transform: translateY(0) scale(1); opacity: 1; }
      }
      .animate-slide-up {
        animation: slide-up 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      }
    </style>
    <script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@19.0.0",
    "react-dom": "https://esm.sh/react-dom@19.0.0",
    "react-dom/client": "https://esm.sh/react-dom@19.0.0/client",
    "@google/genai": "https://esm.sh/@google/genai@1.37.0",
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
    "react/": "https://esm.sh/react@^19.2.3/"
  }
}
</script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./index.tsx"></script>
  </body>
</html>
